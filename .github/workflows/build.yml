name: Build VietMITV ADB Role Bridge DEBUG 5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Find Gradle project
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            PROJECT_DIR="$(find . -type f -name settings.gradle.kts -not -path './.git/*' -printf '%h\n' | head -n 1)"
            if [ -z "$PROJECT_DIR" ]; then
              echo "Không tìm thấy settings.gradle.kts"
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi
          echo "Project: $PROJECT_DIR"

      - name: Build DEBUG APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-ADB-ROLE-BRIDGE-DEBUG5
          path: "$PROJECT_DIR/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
