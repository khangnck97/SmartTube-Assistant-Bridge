name: Build VietMITV ADB Role Bridge DEBUG 5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="VietMITV-YouTube-Voice-GoogleAssistant-ADB-role-bridge-fix5-debug.zip"

          # Case 1: source was already extracted into the repository root.
          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "Source already at repository root."
            exit 0
          fi

          # Case 2: the matching ZIP was uploaded to the repository.
          if [ -f "$ZIP" ]; then
            rm -rf _vietmitv_source
            mkdir -p _vietmitv_source
            unzip -q "$ZIP" -d _vietmitv_source
          else
            # Also accept the same ZIP inside one directory.
            FOUND="$(find . -type f -name "$ZIP" -not -path './.git/*' -print -quit)"
            if [ -z "$FOUND" ]; then
              echo "KHÔNG TÌM THẤY source hoặc $ZIP"
              echo "Các file ở repository:"
              find . -maxdepth 3 -type f -not -path './.git/*' -print | sort | head -200
              exit 1
            fi
            rm -rf _vietmitv_source
            mkdir -p _vietmitv_source
            unzip -q "$FOUND" -d _vietmitv_source
          fi

          # Locate the actual Gradle project after extraction.
          PROJECT_DIR="$(find _vietmitv_source -type f -name settings.gradle.kts -not -path '*/.git/*' -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ZIP không chứa settings.gradle.kts"
            find _vietmitv_source -maxdepth 5 -type f -print | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts
          echo "=== app/build.gradle.kts ==="
          cat app/build.gradle.kts

      - name: Build DEBUG APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Show APK
        shell: bash
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-ADB-ROLE-BRIDGE-DEBUG5
          path: "$PROJECT_DIR/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
