name: Xây dựng APK - Cầu nối ADB VietMITV (ROLE FIX)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tìm và giải nén source ZIP ROLE FIX
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -type f \( \
            -name 'VietMITV-YouTube-Voice-GoogleAssistant-ADB-vietmitv-adb-role-fix.zip' \
            -o -name 'VietMITV-YouTube-Voice-GoogleAssistant-ADB-vietmitv-adb-fixed.zip' \
          \) -print -quit)

          if [ -z "$ZIP" ]; then
            echo "Không tìm thấy source ZIP ROLE FIX."
            echo "Các file ZIP hiện có:"
            find . -maxdepth 3 -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "Đang dùng: $ZIP"
          rm -rf build-src
          mkdir -p build-src
          unzip -q "$ZIP" -d build-src

          ROOT=$(find build-src -maxdepth 3 -name settings.gradle.kts -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "Không tìm thấy project Gradle."
            find build-src -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -e
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Kiểm tra APK
        shell: bash
        run: |
          set -e
          find "${ROOT}/app/build/outputs/apk/debug" -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-ADB-ROLE-FIX-debug
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
