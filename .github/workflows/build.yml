name: Build VietMITV FIX14 FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare source
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Gradle source is already in repository root."
          else
            ZIP=$(find . -maxdepth 2 -type f -name '*.zip' -print -quit || true)
            if [ -z "$ZIP" ]; then
              echo "ERROR: Không tìm thấy source Gradle hoặc file ZIP source."
              find . -maxdepth 3 -type f -print
              exit 1
            fi

            echo "Using source archive: $ZIP"
            rm -rf _source
            mkdir -p _source
            unzip -q "$ZIP" -d _source

            ROOT=$(find _source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)
            if [ -z "$ROOT" ]; then
              echo "ERROR: ZIP không chứa settings.gradle(.kts)."
              find _source -maxdepth 5 -type f -print
              exit 1
            fi

            cp -a "$ROOT"/. .
          fi

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          echo "Gradle source OK"

      - name: Build APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-FIX14-FINAL-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
