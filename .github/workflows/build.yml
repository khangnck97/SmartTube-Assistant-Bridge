name: Build VietMITV Direct ADB Bridge FIX12

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare source
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP=$(find . -type f -name 'VietMITV-YouTube-Voice-GoogleAssistant-ADB-role-bridge-DIRECT-ADB-FIX12.zip' -print -quit || true)
            if [ -z "$ZIP" ]; then
              ZIP=$(find . -type f -iname '*DIRECT*ADB*FIX12*.zip' -print -quit || true)
            fi
            if [ -z "$ZIP" ]; then
              ZIP=$(find . -type f -iname '*VietMITV*ADB*bridge*.zip' -print -quit || true)
            fi

            if [ -z "$ZIP" ]; then
              echo "ERROR: Không tìm thấy source Gradle hoặc ZIP source."
              exit 1
            fi

            rm -rf _source
            mkdir -p _source
            unzip -q "$ZIP" -d _source
            ROOT=$(find _source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)
            test -n "$ROOT"
            cp -a "$ROOT"/. .
          fi

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

          echo "=== Direct bridge checks ==="
          grep -q 'BRIDGE_MODE=DIRECT_AM_START' app/src/main/kotlin/com/vietmitv/youtubevoice/SelfAdbWorker.kt
          grep -q 'am start -a android.intent.action.VIEW' app/src/main/kotlin/com/vietmitv/youtubevoice/SelfAdbWorker.kt
          ! grep -q 'am startservice -n' app/src/main/kotlin/com/vietmitv/youtubevoice/SelfAdbWorker.kt
          echo "DIRECT ADB BRIDGE CHECK: PASS"

      - name: Build DEBUG APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-Direct-ADB-Bridge-FIX12
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
