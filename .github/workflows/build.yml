name: Build VietMITV 15

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP="$(find . -type f -name '*.zip' -print -quit)"
            test -n "$ZIP"
            rm -rf _source
            mkdir _source
            unzip -q "$ZIP" -d _source
            ROOT="$(find _source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
            test -n "$ROOT"
            cp -a "$ROOT"/. .
          fi
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-15-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
