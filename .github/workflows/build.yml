name: Xây dựng APK - Cầu nối ADB VietMITV (FIX Kotlin)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tìm và giải nén source ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -type f -name 'VietMITV-YouTube-Voice-GoogleAssistant-ADB-vietmitv-adb-fixed.zip' -o -name 'VietMITV-ADB-Bridge-vietmitv-adb-fixed.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo 'Không tìm thấy source ZIP fixed.'
            exit 1
          fi
          rm -rf build-src
          mkdir build-src
          unzip -q "$ZIP" -d build-src
          ROOT=$(find build-src -maxdepth 2 -name settings.gradle.kts -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then echo 'Không tìm thấy project Gradle'; exit 1; fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: ${{ env.ROOT }}
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-ADB-vietmitv-adb-FIXED-debug
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
