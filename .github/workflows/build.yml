name: VietMITV ADB Role Bridge DEBUG 7

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build DEBUG APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p dist
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Không tìm thấy APK sau khi build"
            find . -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "APK=$APK"
          cp "$APK" dist/VietMITV-ADB-ROLE-BRIDGE-DEBUG7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-ADB-ROLE-BRIDGE-DEBUG7
          path: dist/VietMITV-ADB-ROLE-BRIDGE-DEBUG7.apk
          if-no-files-found: error
