name: Xây dựng APK - VietMITV ADB Role Bridge DEBUG 4

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chuẩn bị source
        shell: bash
        run: |
          set -e
          rm -rf build-src
          mkdir -p build-src
          if [ -f "settings.gradle.kts" ] && [ -d "app/src/main" ]; then
            cp -a . build-src/
          else
            ZIP=$(find . -type f \( -name 'VietMITV-YouTube-Voice-GoogleAssistant-ADB-role-bridge-fix4-debug.zip' -o -name 'VietMITV-YouTube-Voice-GoogleAssistant-ADB-role-bridge-fix3-debug.zip' \) -print -quit)
            [ -n "$ZIP" ] || { echo 'Không tìm thấy source ZIP DEBUG 4/3'; exit 1; }
            unzip -q "$ZIP" -d build-src
          fi
          ROOT=$(find build-src -type f -name settings.gradle.kts -print -quit | xargs -r dirname)
          [ -n "$ROOT" ] && [ -d "$ROOT/app/src/main" ] || { echo 'Android project không hợp lệ'; exit 1; }
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-ADB-Role-Bridge-Debug4
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
