name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name 'VietMITV-YouTube-Voice-GoogleAssistant-ADB-fixed.zip' | head -n 1)"
          test -n "$ZIP"
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract source ZIP
        run: |
          rm -rf android-source
          mkdir android-source
          unzip -q "$SOURCE_ZIP" -d android-source
          test -f android-source/settings.gradle.kts
          test -f android-source/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        working-directory: android-source
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Voice-GoogleAssistant-ADB-fixed-debug
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
