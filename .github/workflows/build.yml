name: Test1

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and extract Test1.zip
        run: |
          test -f Test1.zip
          rm -rf test1-src
          mkdir test1-src
          unzip -q Test1.zip -d test1-src
          test -d test1-src/app
          test -f test1-src/settings.gradle || test -f test1-src/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper
        working-directory: test1-src
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Build Test1 APK
        working-directory: test1-src
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Prepare Test1.apk
        run: |
          APK=$(find test1-src/app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" Test1.apk

      - name: Upload Test1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Test1
          path: Test1.apk
          if-no-files-found: error
