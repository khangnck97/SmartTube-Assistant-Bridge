name: Build APK - VietMITV ADB Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find source ZIP
        run: |
          ZIP="VietMITV-YouTube-Voice-GoogleAssistant-ADB-vietmitv-adb.zip"
          test -f "$ZIP" || { echo "Missing $ZIP"; exit 1; }
          rm -rf src
          mkdir src
          unzip -q "$ZIP" -d src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        working-directory: src
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-ADB-vietmitv-adb-debug
          path: src/app/build/outputs/apk/debug/app-debug.apk
