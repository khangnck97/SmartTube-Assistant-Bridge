name: VB1

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract VB1.zip
        run: |
          test -f VB1.zip
          rm -rf vb1-src
          mkdir vb1-src
          unzip -q VB1.zip -d vb1-src
          test -f vb1-src/settings.gradle || test -f vb1-src/settings.gradle.kts
          test -d vb1-src/app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper
        working-directory: vb1-src
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Build APK
        working-directory: vb1-src
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Rename APK
        run: |
          APK=$(find vb1-src/app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" VB1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VB1
          path: VB1.apk
          if-no-files-found: error
