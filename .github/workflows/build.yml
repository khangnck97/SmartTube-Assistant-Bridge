name: Test2

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and extract Test2.zip
        run: |
          test -f Test2.zip
          rm -rf test2-src
          mkdir test2-src
          unzip -q Test2.zip -d test2-src
          test -d test2-src/app
          test -f test2-src/settings.gradle || test -f test2-src/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper
        working-directory: test2-src
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Build Test2 APK
        working-directory: test2-src
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Prepare Test2.apk
        run: |
          APK=$(find test2-src/app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" Test2.apk

      - name: Upload Test2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Test2
          path: Test2.apk
          if-no-files-found: error
