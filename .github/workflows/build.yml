name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name 'VietMITV-YouTube-Voice-source*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Không tìm thấy file source ZIP."
            echo "Hãy upload file VietMITV-YouTube-Voice-source-build-from-zip.zip vào thư mục gốc repository."
            exit 1
          fi
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e
          rm -rf android-source
          mkdir android-source
          unzip -q "$SOURCE_ZIP" -d android-source
          test -f android-source/settings.gradle.kts
          test -d android-source/app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        working-directory: android-source
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Voice-debug
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
