name: V15 Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'V15.zip'
      - 'V15.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check V15.zip
        run: test -f V15.zip

      - name: Extract V15.zip
        run: |
          rm -rf V15-build
          mkdir -p V15-build
          unzip -q V15.zip -d V15-build
          echo "Extracted files:"
          find V15-build -maxdepth 3 -type f | sort | head -100

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: V15-build
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V15-debug
          path: V15-build/app/build/outputs/apk/debug/app-debug.apk
