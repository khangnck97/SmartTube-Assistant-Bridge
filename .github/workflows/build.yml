name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir buildsrc
          unzip -q SmartTube-Assistant-Bridge-source.zip -d buildsrc
          echo "Project files:"
          find buildsrc -maxdepth 3 -type f | head -50

      - name: Find Android project
        run: |
          ROOT=$(dirname "$(find buildsrc -name settings.gradle -print -quit)")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Android project: $ROOT"

      - name: Build APK
        run: |
          cd "$ROOT"
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-Assistant-Bridge
          path: ${{ env.ROOT }}/app/build/outputs/apk/release/*.apk
