name: Build VietMITV ADB Role Bridge DEBUG 5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="VietMITV-YouTube-Voice-GoogleAssistant-ADB-role-bridge-fix5-debug.zip"

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            FOUND="$(find . -type f -name "$ZIP" -not -path './.git/*' -print -quit)"
            if [ -z "$FOUND" ]; then
              echo "ERROR: Không tìm thấy source Gradle hoặc $ZIP"
              find . -maxdepth 4 -type f -not -path './.git/*' -print | sort | head -200
              exit 1
            fi

            rm -rf _vietmitv_source
            mkdir -p _vietmitv_source
            unzip -q "$FOUND" -d _vietmitv_source

            PROJECT_DIR="$(find _vietmitv_source -type f -name settings.gradle.kts -printf '%h\n' | while read -r d; do
              if [ -f "$d/app/build.gradle.kts" ]; then echo "$d"; break; fi
            done)"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Không tìm thấy Gradle project có app/build.gradle.kts"
              find _vietmitv_source -maxdepth 6 -type f -print | sort | head -300
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Gradle project: $PROJECT_DIR"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Source OK"

      - name: Build DEBUG APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          echo "=== APK files generated ==="
          find "$PROJECT_DIR" -type f -name '*.apk' -print | sort

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            APK="$(find "$PROJECT_DIR" -type f -name '*.apk' -print -quit)"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: Gradle build succeeded nhưng không tìm thấy APK"
            find "$PROJECT_DIR" -type f -print | grep -E 'outputs|apk|mapping' | head -200 || true
            exit 1
          fi

          cp "$APK" "dist/VietMITV-ADB-ROLE-BRIDGE-DEBUG5.apk"
          ls -lh dist/VietMITV-ADB-ROLE-BRIDGE-DEBUG5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-ADB-ROLE-BRIDGE-DEBUG5
          path: dist/VietMITV-ADB-ROLE-BRIDGE-DEBUG5.apk
          if-no-files-found: error
