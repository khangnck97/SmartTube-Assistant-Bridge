name: Xây dựng APK - VietMITV ADB Role Bridge DEBUG 3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chuẩn bị source
        shell: bash
        run: |
          set -e
          rm -rf build-src
          mkdir -p build-src

          if [ -f "settings.gradle.kts" ] && [ -d "app/src/main" ]; then
            echo "Phát hiện source Android trực tiếp trong repo."
            cp -a . build-src/
          else
            ZIP=$(find . -type f \( \
              -name 'VietMITV-YouTube-Voice-GoogleAssistant-ADB-role-bridge-fix3-debug.zip' \
              -o -name 'VietMITV-YouTube-Voice-GoogleAssistant-ADB-role-bridge-fix2-debug.zip' \
            \) -print -quit)
            if [ -z "$ZIP" ]; then
              echo "KHÔNG TÌM THẤY source ZIP DEBUG."
              find . -maxdepth 4 -type f | sort | head -200
              exit 1
            fi
            echo "Dùng source ZIP: $ZIP"
            unzip -q "$ZIP" -d build-src
          fi

          ROOT=$(find build-src -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/app/src/main" ]; then
            echo "Không tìm thấy Android project hợp lệ."
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Kiểm tra APK
        shell: bash
        run: |
          set -e
          find "${PROJECT_ROOT}/app/build/outputs/apk/debug" -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietMITV-ADB-Role-Bridge-Debug3
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
